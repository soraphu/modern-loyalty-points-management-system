info:
  name: Earn Points
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}{{ApiURL}}/customer/earn-points"
  headers:
    - name: Authorization
      value: Bearer {{customerToken}}
  body:
    type: json
    data: |-
      {
        "code_string" : "PT-eb62eb57bb2a224601a616dc88bf1f20"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  200 => {
    success : true,
    msg : "Earn points successfully.",
    data : {
      transaction : {
        id: string;
        referenceId: string;
        pointsAmount: number;
        type: 'EARN' ;
        createdAt: Date;
        userId: string;
      }
    }
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Access token missing.",
    error_code : "ACC_TOKEN_MISSING"
  }

  ---------------------------------------------------------------

