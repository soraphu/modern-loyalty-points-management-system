info:
  name: Create Admin
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseURL}}{{ApiURL}}/admin/admins"
  headers:
    - name: Authorization
      value: Bearer $access_token
  body:
    type: json
    data: |-
      {
          "role" : "MANAGER",
          "username" : "WWs",
          "firstname" : "Soraphu",
          "lastname" : "Thongjun",
          "password" : "12345678"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  201 => {
    success : true,
    msg : "Admin created.",
    data: {
      new_admin: {
        id: string;
        role: AdminRoles;
        username: string;
        firstname: string;
        lastname: string;
        createdAt: Date;
        updatedAt: Date;
      }
    } 
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "Request payload body or parameters are missing entirely.",
    error_code : "FIEDS_MISSING"
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "Missing or empty required field: '${field}'",
    error_code : "FIEDS_MISSING"
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "Password must be at least 8 characters long.",
    error_code : "INVALID_LENGTH"
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "Password cannot exceed 50 characters.",
    error_code : "FORBIDDEN_CHAR"
  }

  ---------------------------------------------------------------

  409 => {
    success : false,
    msg : "Owner account already exist.",
    error_code : "OWNER_ALREADY_EXIST"
  }

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Unable to create admin an unexpected internal server error occurred.",
    error_code : "SERVER_ERROR"
  } 

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Internal server error",
    error_code : "SERVER_ERROR"
  }

  ---------------------------------------------------------------
