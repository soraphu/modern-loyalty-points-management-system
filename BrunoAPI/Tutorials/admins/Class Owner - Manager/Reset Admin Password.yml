info:
  name: Reset Admin Password
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseURL}}{{ApiURL}}/admin/admins/:admin_id/password-reset"
  headers:
    - name: Authorization
      value: Bearer {{ownerToken}}
  params:
    - name: admin_id
      value: 7687a8d6-57d2-4e77-a391-07b854221ebe
      type: path
  body:
    type: json
    data: |-
      {
        "new_password" : "12345678"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  200 => {
    success : true,
    msg : "Reset admin ${updatedAdmin.username} password successfully.",
    data : {
      updated_admin : {
        id: string;
        username: string;
        role: AdminRoles;
        firstname: string;
        lastname: string;
        updatedAt: Date;
      }
    }
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "Request payload body or parameters are missing entirely.",
    error_code : "FIEDS_MISSING"
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "Missing or empty required field: '${field}'",
    error_code : "FIEDS_MISSING"
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "You do not have permission to access this resource.",
    error_code : "FORBIDDEN_ROLE"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Access token missing.",
    error_code : "ACC_TOKEN_MISSING"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Invalid or expires access token.",
    error_code : "INVALID_ACC_TOKEN"
  }

  ---------------------------------------------------------------

  404 => {
    success : false,
    msg : "Admin account record not found.",
    error_code : "ADMIN_NOT_FOUND"
  }

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Unable to reset admin password an unexpected internal server error occurred.",
    error_code : "SERVER_ERROR"
  } 

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Internal server error",
    error_code : "SERVER_ERROR"
  }

  ---------------------------------------------------------------
