info:
  name: Delete Admin
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseURL}}{{ApiURL}}/admin/admins/:admin_id"
  headers:
    - name: Authorization
      value: Bearer {{ownerToken}}
  params:
    - name: admin_id
      value: 7687a8d6-57d2-4e77-a391-07b854221ebe
      type: path
  body:
    type: json
    data: "{}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  200 => {
    success : true,
    msg : "Admin ${deletedAdmin.username} deleted.",
    data : {
      deleted_admin : {
        id: string;
        username: string;
        role: AdminRoles;
        firstname: string;
        lastname: string;
      }
    }
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "You do not have permission to access this resource.",
    error_code : "FORBIDDEN_ROLE"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Access token missing.",
    error_code : "ACC_TOKEN_MISSING"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Invalid or expires access token.",
    error_code : "INVALID_ACC_TOKEN"
  }

  ---------------------------------------------------------------

  404 => {
    success : false,
    msg : "Admin account record not found.",
    error_code : "ADMIN_NOT_FOUND"
  }

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Unable to delete admin account an unexpected internal server error occurred.",
    error_code : "SERVER_ERROR"
  } 

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Internal server error",
    error_code : "SERVER_ERROR"
  }

  ---------------------------------------------------------------
