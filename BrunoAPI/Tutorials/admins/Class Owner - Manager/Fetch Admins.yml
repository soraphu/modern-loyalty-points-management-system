info:
  name: Fetch Admins
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}{{ApiURL}}/admin/admins"
  headers:
    - name: Authorization
      value: Bearer {{ownerToken}}
  body:
    type: json
    data: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  200 => {
    success : true,
    msg : "Fetch admins successfully.",
    admins : [
      {
        username: string;
        id: string;
        role: AdminRoles;
        firstname: string;
        lastname: string;
        createdAt: Date;
        updatedAt: Date;
      }, ...
    ]
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "You do not have permission to access this resource.",
    error_code : "FORBIDDEN_ROLE"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Access token missing.",
    error_code : "ACC_TOKEN_MISSING"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Invalid or expires access token.",
    error_code : "INVALID_ACC_TOKEN"
  }

  ---------------------------------------------------------------

  404 => {
    success : false,
    msg : "Admin account record not found.",
    error_code : "ADMIN_NOT_FOUND"
  }

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Unable to fetch admins an unexpected internal server error occurred.",
    error_code : "SERVER_ERROR"
  } 

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Internal server error",
    error_code : "SERVER_ERROR"
  }

  ---------------------------------------------------------------
