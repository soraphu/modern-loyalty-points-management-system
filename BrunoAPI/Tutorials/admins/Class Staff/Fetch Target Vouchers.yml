info:
  name: Fetch Target Vouchers
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseURL}}{{ApiURL}}/admin/vouchers/:voucher_code"
  headers:
    - name: Authorization
      value: Bearer {{staffToken}}
  params:
    - name: voucher_code
      value: OO2VVA
      type: path
  body:
    type: json
    data: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  200 => {
    success : true,
    msg : "Fetch voucher $voucherCode sucessful.",
    data : {
      voucher : {
        id: string;
        userId: string;
        rewardId: string;
        status: VoucherStatus ;
        createdAt: Date;
        expiresAt: Date;
        user: {
            id: string;
            lineId: string;
            lineDisplayName: string;
            linePictureUrl: string;
        },
        reward: {
            id: string;
            rewardName: string;
            pointsCost: number;
            imageUrl: string | null;
            active: boolean;
            createdAt: Date;
        }
      }
    }
  }

  ---------------------------------------------------------------

  404 => {
    success : false,
    msg : "Admin account record not found.",
    error_code : "ADMIN_NOT_FOUND"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Access token missing.",
    error_code : "ACC_TOKEN_MISSING"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Invalid or expires access token.",
    error_code : "INVALID_ACC_TOKEN"
  }

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Unable to fetch vouchers data records, an unexpected internal server error occurred.",
    error_code : "SERVER_ERROR"
  } 

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Internal server error",
    error_code : "SERVER_ERROR"
  }

  ---------------------------------------------------------------
