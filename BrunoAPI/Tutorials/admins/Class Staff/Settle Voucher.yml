info:
  name: Settle Voucher
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseURL}}{{ApiURL}}/admin/vouchers/:voucher_code/settle"
  headers:
    - name: Authorization
      value: Bearer {{staffToken}}
  params:
    - name: voucher_code
      value: I46Y3B
      type: path
  body:
    type: json
    data: "{}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  200 => {
    success : true,
    msg : "Settled voucher ${voucherCode} successful.",
    data : {
      transaction: {
        id: string;
        createdAt: Date;
        userId: string;
        referenceId: string;
        pointsAmount: number;
        type: TransactionType;
      },
      settled_voucher: {
        id: string;
        createdAt: Date;
        userId: string;
        voucherCode: string;
        rewardId: string;
        status: VoucherStatus;
        expiresAt: Date | null;
        reward : {
          id: string;
          createdAt: Date;
          rewardName: string;
          pointsCost: number;
          imageUrl: string | null;
          active: boolean;
        }
      }
    }
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "Voucher already claimed.",
    error_code : "ALREADY_CLAIMED"
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "Voucher already cancelled.",
    error_code : "ALREADY_CANCELLED"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Access token missing.",
    error_code : "ACC_TOKEN_MISSING"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Invalid or expires access token.",
    error_code : "INVALID_ACC_TOKEN"
  }

  ---------------------------------------------------------------

  404 => {
    success : false,
    msg : "Admin account record not found.",
    error_code : "ADMIN_NOT_FOUND"
  }

  ---------------------------------------------------------------

  404 => {
    success : false,
    msg : "Voucher not found.",
    error_code : "VOUCHER_NOT_FOUND"
  }

  ---------------------------------------------------------------

  410 => {
    success : false,
    msg : "Voucher expired.",
    error_code : "EXPIRED"
  }

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Unable to complete voucher validation.",
    error_code : "SERVER_ERROR"
  } 

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Unable to complete voucher settlement.",
    error_code : "SERVER_ERROR"
  } 

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Internal server error",
    error_code : "SERVER_ERROR"
  }

  ---------------------------------------------------------------
