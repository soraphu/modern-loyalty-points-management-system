info:
  name: Admin Get Payload
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseURL}}{{ApiURL}}/admin/payload"
  headers:
    - name: Authorization
      value: Bearer {{staffToken}}
  body:
    type: json
    data: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  200 => {
    success : true,
    msg : "Get token payload success.",
    data : {
      admin_payload : {
        id: string;
        role: AdminRoles;
        username: string;
      }
    }
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Access token missing.",
    error_code : "ACC_TOKEN_MISSING"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Invalid or expires access token.",
    error_code : "INVALID_ACC_TOKEN"
  }

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Unable to login an unexpected internal server error occurred.",
    error_code : "SERVER_ERROR"
  } 

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Internal server error",
    error_code : "SERVER_ERROR"
  }

  ---------------------------------------------------------------
