info:
  name: Fetch Customers
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}{{ApiURL}}/admin/customers"
  headers:
    - name: Authorization
      value: Bearer {{managerToken}}
  body:
    type: json
    data: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  200 => {
    success : true,
    msg : "Fetch customers successfully.",
    customers : [
      {
        id: string;
        lineId: string;
        lineDisplayName: string;
        linePictureUrl: string | null;
        totalPoints: number;
        createdAt: Date;
      }, ...
    ]
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Access token missing.",
    error_code : "ACC_TOKEN_MISSING"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Invalid or expires access token.",
    error_code : "INVALID_ACC_TOKEN"
  }

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Unable to fetch customers an unexpected internal server error occurred.",
    error_code : "SERVER_ERROR"
  } 

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Internal server error",
    error_code : "SERVER_ERROR"
  }

  ---------------------------------------------------------------
