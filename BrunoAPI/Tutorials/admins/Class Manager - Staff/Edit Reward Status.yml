info:
  name: Edit Reward Status
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseURL}}{{ApiURL}}/admin/rewards/:reward_id/state-adjustment"
  headers:
    - name: Authorization
      value: Bearer {{managerToken}}
  params:
    - name: reward_id
      value: c5806d47-e54b-4f96-af60-ce2ab4071668
      type: path
  body:
    type: json
    data: |-
      {
        "active" : false
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  200 => {
    success : true,
    msg : "Set reward name ${updatedReward.rewardName} active ${updatedReward.active} successful.",
    data : {
      updated_reward : {
        id: string;
        createdAt: Date;
        rewardName: string;
        pointsCost: number;
        imageUrl: string | null;
        active: boolean;
      }
    }
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "Request payload body or parameters are missing entirely.",
    error_code : "FIEDS_MISSING"
  }

  ---------------------------------------------------------------

