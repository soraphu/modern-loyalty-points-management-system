info:
  name: Admin Login
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseURL}}{{ApiURL}}/admin/login"
  body:
    type: json
    data: |-
      {
        "username" : "Josept",
        "password" : "12345678"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  200 => {
    success : true,
    msg : "Login successfully.",
    data : {
      access_token : string,
      admin : {
        username: string;
        id: string;
        role: AdminRoles;
        firstname: string;
        lastname: string;
        createdAt: Date;
        updatedAt: Date;
      }
    }
  }

  ---------------------------------------------------------------


  400 => {
    success : false,
    msg : "Request payload body or parameters are missing entirely.",
    error_code : "FIEDS_MISSING"
  }

  ---------------------------------------------------------------

  400 => {
    success : false,
    msg : "Missing or empty required field: '${field}'",
    error_code : "FIEDS_MISSING"
  }

  ---------------------------------------------------------------

  401 => {
    success : false,
    msg : "Invalid username or password.",
    error_code : "INVALID_ACCOUNT"
  }

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Unable to login an unexpected internal server error occurred.",
    error_code : "SERVER_ERROR"
  } 

  ---------------------------------------------------------------

  500 => {
    success : false,
    msg : "Internal server error",
    error_code : "SERVER_ERROR"
  }

  ---------------------------------------------------------------
